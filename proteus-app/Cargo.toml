[package]
name = "proteus-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Proteus desktop UI — gpui / gpui-component only (PRD §5/§6)"

[[bin]]
name = "proteus"
path = "src/main.rs"

[dependencies]
proteus-core = { path = "../proteus-core" }
anyhow = { workspace = true }
# PRD §5 stack: native desktop UI only — gpui + gpui-component in the app crate,
# never in proteus-core (PRD §6 enforces the lib/bin split).
gpui = "0.2.2"
gpui-component = "0.5.1"
# PRD §8: native Open / Save As dialogs are the primary input path.
rfd = "0.17"